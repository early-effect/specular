# Generated by histos. Do not edit. Run './histos workflow --update' to regenerate.
name: histos-deps
on:
  schedule:
    - cron: "0 6 * * 1"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      dry-run:
        description: doctor plus update, no branch or pull request
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: histos-deps
  cancel-in-progress: false
jobs:
  deps:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"
          persist-credentials: false
      - uses: ./.github/actions/origin-head
      - uses: ./.github/actions/setup
      - run: ./histos doctor --preflight histos-deps
        env:
          GH_TOKEN: ${{ github.token }}
      - run: ./histos deps update --yes
      - run: ./histos resolve --update
      - run: ./histos workflow --update
      - run: ./histos deps audit --report
      - if: inputs.dry-run != true
        run: ./histos deps pr
        env:
          GH_TOKEN: ${{ github.token }}
          HISTOS_DRY_RUN: ${{ inputs.dry-run }}
